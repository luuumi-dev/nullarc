name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang make

    - name: Fetch Phoenix firmware fixtures (linux-firmware)
      run: make fixtures

    - name: Build and run unit tests
      env:
        REQUIRE_FIXTURES: "1"
      shell: bash
      run: |
        set +e
        make test CXX=clang++ 2>&1 | tee test.log
        status=${PIPESTATUS[0]}
        if [ "$status" -ne 0 ]; then
          # Surface the failing output as an annotation on the PR.
          msg=$(tail -n 25 test.log | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Unit tests failed::${msg}"
        fi
        exit "$status"

  sampler-key-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Test sampler keys with ASan and UBSan
      run: make test-nmplugin-sampler-key
